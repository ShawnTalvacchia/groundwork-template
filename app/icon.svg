<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Starter mark: the same shape as the /system wordmark. The kickoff is
       where this becomes yours (KICKOFF.md → "Make the identity yours").

       Same path data as components/ui/Mark.tsx. This file is standalone
       because a favicon has no stylesheet to inherit from, so the brand
       colour is inlined here rather than read from app/globals.css.

       The centre is a REAL cutout: tile and diamond are one path with
       fill-rule="evenodd", so the centre is unpainted and the browser's tab
       strip shows through it. Nothing to get backwards on a dark tab.

       WHY THIS FILE USES --brand-400 AND THE OTHER TWO USE --brand-600:
       a favicon is the one renderer whose backdrop we do not control. Mark.tsx
       sits on surfaces the stylesheet themes, and the link preview's card
       background is ours; browser chrome is somebody else's, and it is dark
       for a large share of people. Measured against the tab strip, brand-600
       is 2.04:1 on dark chrome - below the 3:1 non-text minimum, so the
       cutout's diamond disappears and the mark reads as a plain square.
       brand-400 is the one step on the ramp that clears 3:1 BOTH ways
       (3.60:1 dark, 3.41:1 light). Lighter steps fail on light chrome.

       This is a per-renderer colour, not per-renderer centre logic - the
       centre is a hole in all three, with no mechanism at all. Keep it that
       way when you swap in your own mark.

       ONE PATH, AND NO OUTLINE ON TOP OF IT. This file briefly carried a
       hairline stroke inset 1 unit from the tile edge, meant to firm up the
       silhouette on dark chrome. A 2-wide stroke centred on that path paints
       the outermost ring of the mark, so the stroke IS the silhouette - it
       does not reinforce the edge, it replaces it. Composited over brand-400
       it measures 2.27:1 on a light tab strip and 2.98:1 on white, both under
       the 3:1 above. Deleting it is what restores the numbers this comment
       claims. If your own mark is a DARK brand, the trade can genuinely run
       the other way; measure both backdrops before adding one back. -->
  <path
    d="M7 0H25A7 7 0 0 1 32 7V25A7 7 0 0 1 25 32H7A7 7 0 0 1 0 25V7A7 7 0 0 1 7 0Z M16 7.5L24.5 16L16 24.5L7.5 16Z"
    fill-rule="evenodd"
    fill="#6366f1"
  />
</svg>
